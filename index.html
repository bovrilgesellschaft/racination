  <title>Racination</title>

</head>

  <script src="data/stories.js"></script>
  <script src="data/guests.js"></script>
  <script src="data/consent.js"></script>
  <script src="data/romance.js"></script>
  <script src="data/scenekit.js"></script>
  <script src="data/ephemeris.js"></script>
  <script src="data/working.js"></script>
  <script src="data/working-events.js"></script>
  <!-- The scene files, and authored.js if it is there (see scenes/list.js). -->

  <script src="household.js"></script>
  <script src="mistress.js"></script>
